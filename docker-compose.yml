services:
  catthreadservice:
    image: catthreadservice
    build:
      context: ./MicroServices/CatThreadService
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - HTTP_PORTS=5001
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=forum_cat_thread;User=root;Password=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required};

  userservice:
    image: userservice
    build:
      context: ./MicroServices/UserServices
    ports:
      - "5002:5002"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - HTTP_PORTS=5002
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=forum_user_role;User=root;Password=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required};

  postservice:
    image: postservice
    build:
      context: ./MicroServices/PostService
    ports:
      - "5003:5003"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - HTTP_PORTS=5003
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=forum_post_reply;User=root;Password=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required};

  application:
    image: 4roomforum
    build:
      context: ./4roomforum
    ports:
      - "5287:5287"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - HTTP_PORTS=5287
      - ServiceUrls__CatThreadService=http://catthreadservice:5001/
      - ServiceUrls__UserService=http://userservice:5002/
      - ServiceUrls__PostService=http://postservice:5003/
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
    depends_on:
      - catthreadservice
      - userservice
      - postservice

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
      
volumes:
  mysql-data:
